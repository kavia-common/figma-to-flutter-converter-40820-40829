<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Checkout - 754:4266</title>
  <link rel="preload" href="./figmaimages/figma_image_754_4266.png" as="image" />
  <link rel="stylesheet" href="./checkout-754-4266.css" />
</head>
<body>
  <main id="screen-754-4266" class="screen" role="main" aria-label="Checkout">
    <img class="screen-image" src="./figmaimages/figma_image_754_4266.png" alt="" aria-hidden="true" />

    <div class="top-bar" role="toolbar" aria-label="Top Bar">
      <button class="back-wrap" aria-label="Back">
        <img class="back-ellipse" src="./figmaimages/figma_image_754_4299.svg" alt="" />
        <img class="back-vector" src="./figmaimages/figma_image_754_3730_29221_3865.svg" alt="" />
      </button>
      <div class="top-title">Shopping Cart (5)</div>
    </div>

    <div class="section-title">Delivery Address</div>

    <section class="address-card address-home" aria-label="Home Address">
      <div class="card-bg bg-home"></div>
      <div class="card-title">Home</div>
      <div class="card-row">
        <div class="card-address">36 green way, Sunamganj</div>
        <div class="edit-wrap" role="button" tabindex="0" aria-label="Edit Home Address">
          <span class="edit-text">Edit</span>
          <div class="check-wrap" aria-hidden="true">
            <img class="check-ellipse" src="./figmaimages/figma_image_754_4275.svg" alt="" />
            <img class="check-vector" src="./figmaimages/figma_image_754_3723_528_1460.svg" alt="" />
          </div>
        </div>
      </div>
    </section>

    <section class="address-card address-office" aria-label="Office Address">
      <div class="card-bg bg-office"></div>
      <div class="card-title">Office</div>
      <div class="card-row">
        <div class="card-address multi">Medical road, Halal lab, Sunamganj</div>
        <div class="edit-wrap" role="button" tabindex="0" aria-label="Edit Office Address">
          <span class="edit-text">Edit</span>
        </div>
      </div>
    </section>

    <section class="add-address" role="button" tabindex="0" aria-label="Add New Address">
      <div class="add-bg"></div>
      <div class="add-inner">
        <div class="add-icon">
          <div class="add-icon-ellipse"></div>
          <div class="add-plus">
            <img class="add-plus-outer" src="./figmaimages/figma_image_754_4097.svg" alt="" />
          </div>
        </div>
        <div class="add-text">Add New Address</div>
      </div>
    </section>

    <button class="primary-button" type="button" aria-label="Add Card">
      <div class="primary-bg"></div>
      <span class="primary-text">Add Card</span>
    </button>
  </main>

  <script src="./checkout-754-4266.js"></script>
</body>
</html>
