<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Grocery Home - 754:3616</title>
  <link rel="preload" href="./figmaimages/figma_image_754_3616.png" as="image" />
  <link rel="stylesheet" href="./grocery-home-754-3616.css" />
</head>
<body>
  <main id="screen-754-3616" class="screen" role="main" aria-label="Grocery Home">
    <img class="screen-image" src="./figmaimages/figma_image_754_3616.png" alt="" aria-hidden="true" />

    <div class="header-bg"></div>

    <div class="top-row" role="toolbar" aria-label="Top bar">
      <div class="greeting">Hey, Halal Lab</div>
      <button class="cart-wrap" aria-label="Open cart">
        <img class="cart-bag" src="./figmaimages/figma_image_754_4055.svg" alt="" />
        <img class="cart-bag-stroke" src="./figmaimages/figma_image_754_3712.svg" alt="" />
        <div class="cart-badge">
          <img src="./figmaimages/figma_image_754_3715.svg" alt="" />
          <span class="cart-count">3</span>
        </div>
      </button>
    </div>

    <div class="search-bar">
      <img class="search-icon" src="./figmaimages/figma_image_754_3706_29221_2634.svg" alt="" />
      <span class="search-text">Search products or store</span>
    </div>

    <div class="delivery-row" aria-label="Delivery info">
      <div class="delivery-left">
        <span class="delivery-label">DELIVERY TO</span>
        <div class="delivery-value">
          <span>Green Way 3000, Sylhet</span>
          <img class="arrow-small" src="./figmaimages/figma_image_754_4001.svg" alt="" />
        </div>
      </div>
      <div class="delivery-right" style="text-align:right">
        <span class="delivery-label">WITHIN</span>
        <div class="delivery-value" style="justify-content:flex-end">
          <span>1 Hour</span>
          <img class="arrow-small" src="./figmaimages/figma_image_754_4001.svg" alt="" />
        </div>
      </div>
    </div>

    <div class="banner-cards" aria-label="Highlights">
      <div class="banner banner-savings">
        <div class="banner-text">
          <div class="banner-value">Get your groceries</div>
          <div class="banner-sub">with nectar</div>
        </div>
      </div>
      <div class="banner banner-time">
        <div class="banner-text">
          <div class="banner-value">Pick up delivery</div>
          <div class="banner-sub">in minutes</div>
        </div>
      </div>
    </div>

    <h2 class="section-title">Recommended</h2>

    <section class="cards-grid" aria-label="Product grid">
      <article class="card" aria-label="Fresh Fruits">
        <div class="card-image-icon">
          <img class="v1 circlebox" src="./figmaimages/figma_image_754_4096.svg" alt="" />
          <img class="v2" src="./figmaimages/figma_image_754_3723.svg" alt="" />
          <img class="v3" src="./figmaimages/figma_image_754_4208.svg" alt="" />
        </div>
        <div class="card-content">
          <div class="card-price">$4.99</div>
          <div class="card-title">Fresh Fruits</div>
          <div class="card-bottom">
            <button class="btn-plus" aria-label="Add Fresh Fruits">
              <img class="btn-bg" src="./figmaimages/figma_image_754_3631.svg" alt="" />
              <img class="btn-plus-icon" src="./figmaimages/figma_image_754_3636.svg" alt="" />
            </button>
          </div>
        </div>
      </article>

      <article class="card" aria-label="Vegetables">
        <div class="card-image-icon">
          <img class="v1 circlebox" src="./figmaimages/figma_image_754_4251.svg" alt="" />
          <img class="v2" src="./figmaimages/figma_image_754_3722.svg" alt="" />
          <img class="v3" src="./figmaimages/figma_image_754_4342.svg" alt="" />
        </div>
        <div class="card-content">
          <div class="card-price">$7.29</div>
          <div class="card-title">Vegetables</div>
          <div class="card-bottom">
            <button class="btn-plus" aria-label="Add Vegetables">
              <img class="btn-bg" src="./figmaimages/figma_image_754_3631.svg" alt="" />
              <img class="btn-plus-icon" src="./figmaimages/figma_image_754_3636.svg" alt="" />
            </button>
          </div>
        </div>
      </article>

      <article class="card" aria-label="Dairy & Eggs">
        <div class="card-image-icon">
          <img class="v1 circlebox" src="./figmaimages/figma_image_754_4096.svg" alt="" />
          <img class="v2" src="./figmaimages/figma_image_754_3706.svg" alt="" />
          <img class="v3" src="./figmaimages/figma_image_754_4365.svg" alt="" />
        </div>
        <div class="card-content">
          <div class="card-price">$5.15</div>
          <div class="card-title">Dairy & Eggs</div>
          <div class="card-bottom">
            <button class="btn-plus" aria-label="Add Dairy & Eggs">
              <img class="btn-bg" src="./figmaimages/figma_image_754_3631.svg" alt="" />
              <img class="btn-plus-icon" src="./figmaimages/figma_image_754_3636.svg" alt="" />
            </button>
          </div>
        </div>
      </article>

      <article class="card" aria-label="Bakery">
        <div class="card-image-icon">
          <img class="v1 circlebox" src="./figmaimages/figma_image_754_4251.svg" alt="" />
          <img class="v2" src="./figmaimages/figma_image_754_3723.svg" alt="" />
          <img class="v3" src="./figmaimages/figma_image_754_4363.svg" alt="" />
        </div>
        <div class="card-content">
          <div class="card-price">$3.49</div>
          <div class="card-title">Bakery</div>
          <div class="card-bottom">
            <button class="btn-plus" aria-label="Add Bakery">
              <img class="btn-bg" src="./figmaimages/figma_image_754_3631.svg" alt="" />
              <img class="btn-plus-icon" src="./figmaimages/figma_image_754_3636.svg" alt="" />
            </button>
          </div>
        </div>
      </article>
    </section>

    <nav class="tabbar" aria-label="Tab bar">
      <div class="tabbar-bg"></div>
      <button class="tab-home" aria-label="Home">
        <img class="home-hex" src="./figmaimages/figma_image_754_4063.svg" alt="" />
        <img class="home-icon" src="./figmaimages/figma_image_754_3730_29221_3865.svg" alt="" />
      </button>
      <button class="tab-categories" aria-label="Categories">
        <img class="cat-icon" src="./figmaimages/figma_image_754_3733.svg" alt="" />
        <span class="tab-text">Categories</span>
      </button>
      <button class="tab-fav" aria-label="Favorite">
        <img class="fav-icon" src="./figmaimages/figma_image_754_3723.svg" alt="" />
        <span class="tab-text">Favorite</span>
      </button>
      <button class="tab-more" aria-label="More">
        <span class="more-dots" aria-hidden="true"></span>
        <span class="tab-text">More</span>
      </button>
    </nav>
  </main>

  <script src="./grocery-home-754-3616.js"></script>
</body>
</html>
