<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grocery Shop - Mobile App UI Kit</title>
  <link rel="preload" href="/assets/figmaimages/figma_image_33438_324.png" as="image" />
  <link rel="preload" href="/assets/figmaimages/figma_image_33438_325.png" as="image" />
  <link rel="preload" href="/assets/figmaimages/figma_image_33438_323.png" as="image" />
  <link rel="preload" href="/assets/figmaimages/figma_image_33438_300.png" as="image" />
  <link rel="preload" href="/assets/figmaimages/figma_image_33438_308.png" as="image" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="landing">
    <aside class="hero">
      <header class="hero__header">
        <h1 class="hero__title">Grocery Shop</h1>
        <p class="hero__subtitle">Mobile App UI Kit</p>
      </header>

      <ul class="hero__features">
        <li class="chip">High Quality</li>
        <li class="chip">Organized layer</li>
        <li class="chip">Full Customizable</li>
        <li class="chip">Styleguide</li>
      </ul>

      <div class="hero__footer">
        <div class="badge">
          <div class="badge__figma">
            <!-- Approximated Figma icon using a single provided vector circle with brand color -->
            <img src="/assets/figmaimages/figma_image_33438_318.svg" alt="Figma logo vector" class="figma__vector" />
          </div>
        </div>
        <div class="screens-card">
          <span class="screens-card__label">16 Screens</span>
        </div>
      </div>
    </aside>

    <section class="gallery" aria-label="UI Screens">
      <figure class="phone phone--orders rot-a">
        <img src="/assets/figmaimages/figma_image_33438_323.png" alt="Orders screen preview" />
      </figure>
      <figure class="phone phone--home rot-b">
        <img src="/assets/figmaimages/figma_image_33438_324.png" alt="Grocery Home screen preview" />
      </figure>
      <figure class="phone phone--details rot-c">
        <img src="/assets/figmaimages/figma_image_33438_325.png" alt="Product details screen preview" />
      </figure>
      <figure class="phone phone--cart rot-d">
        <img src="/assets/figmaimages/figma_image_33438_300.png" alt="Shopping Cart Offer screen preview" />
      </figure>
      <figure class="phone phone--track rot-e">
        <img src="/assets/figmaimages/figma_image_33438_308.png" alt="Track Order screen preview" />
      </figure>
      <figure class="phone phone--categories rot-f">
        <img src="/assets/figmaimages/figma_image_33438_311.png" alt="Categories screen preview" />
      </figure>
    </section>
  </main>

  <script src="./scripts.js"></script>
</body>
</html>
